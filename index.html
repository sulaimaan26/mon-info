<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitor Count</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    #result {
      font-size: 24px;
      color: #2c3e50;
      margin-top: 20px;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Start your Interview</h1>
  <p>Click the button</p>
  <button onclick="detectMonitors()">Start</button>
  <div id="result"></div>

  <script>
    async function detectMonitors() {
      const resultEl = document.getElementById('result');

      if (window.getScreenDetails) {
        try {
          const details = await window.getScreenDetails();
          resultEl.textContent = `Detected ${details.screens.length} monitor(s).`;
        } catch (error) {
          resultEl.textContent = "Permission denied or not supported in this browser.";
          console.error(error);
        }
      } else {
        // Fallback method
        const totalWidth = window.screen.width;
        const availWidth = window.screen.availWidth;

        let count = 1;
        if (totalWidth > availWidth + 1000) {
          count = Math.round(totalWidth / availWidth);
        }

        resultEl.textContent = `Estimated monitor count: ${count} (approximate)`;
      }
    }
  </script>
</body>
</html>
